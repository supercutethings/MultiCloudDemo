name: terraform-plan

on:
  pull_request:
    paths:
      - "infra/**"
      - "platform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write # OIDC: no static AWS credentials anywhere in the repository
  pull-requests: write

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # Runs without cloud credentials: formatting and validation catch most mistakes.
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format check
        run: terraform fmt -check -recursive infra platform

      - name: Validate modules
        run: |
          set -euo pipefail
          for dir in infra/modules/aws/* infra/envs/aws/dev infra/bootstrap/aws; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  plan:
    name: plan (aws/dev)
    needs: validate
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/aws/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-tf-plan

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Plan
        run: |
          terraform plan -input=false -lock-timeout=5m -out=tfplan
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: Policy check
        run: |
          set -euo pipefail
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" conftest
          "$RUNNER_TEMP/conftest" test plan.json -p ../../../../platform/policies

      - name: Comment the plan on the pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = 'infra/envs/aws/dev/plan.txt';
            const plan = fs.existsSync(file) ? fs.readFileSync(file, 'utf8').slice(0, 60000) : 'Plan was not produced. Check the workflow logs.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Terraform plan (`aws/dev`)\n\n<details><summary>Show plan</summary>\n\n```terraform\n' + plan + '\n```\n\n</details>',
            });
