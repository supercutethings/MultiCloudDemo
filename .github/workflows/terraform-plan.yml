name: terraform-plan

on:
  pull_request:
    paths:
      - "infra/**"
      - "platform/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch: # manual run; the only way to plan outside a pull request

permissions:
  contents: read
  id-token: write # OIDC: no static cloud credentials anywhere in the repository
  pull-requests: write

concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # Runs without cloud credentials: formatting and validation catch most mistakes.
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format check
        run: terraform fmt -check -recursive infra platform

      - name: Validate modules
        run: |-
          set -euo pipefail
          for dir in infra/modules/aws/* infra/modules/azure/* infra/modules/gcp/* \
                     infra/envs/aws/dev infra/envs/azure/* infra/envs/gcp/* \
                     infra/bootstrap/aws infra/bootstrap/gcp; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  # Also credential-free: the providers are mocked, so this asserts the contract in
  # infra/contracts/README.md without an account. It is the job that keeps that table from
  # drifting away from the modules -- and the one that catches provider schema mistakes
  # that `validate` happily accepts.
  contract:
    name: contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform test
        run: |
          terraform init -backend=false -input=false
          terraform test -no-color

  plan-aws:
    name: plan (aws/dev)
    needs: validate
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/aws/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-tf-plan

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Plan
        run: |
          terraform plan -input=false -lock-timeout=5m -out=tfplan
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: Policy check
        run: |-
          set -euo pipefail
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" conftest
          "$RUNNER_TEMP/conftest" test plan.json -p ../../../../platform/policies

      - name: Comment the plan on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |-
            const fs = require('fs');
            const file = 'infra/envs/aws/dev/plan.txt';
            const plan = fs.existsSync(file) ? fs.readFileSync(file, 'utf8').slice(0, 60000) : 'Plan was not produced. Check the workflow logs.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Terraform plan (`aws/dev`)\n\n<details><summary>Show plan</summary>\n\n```terraform\n' + plan + '\n```\n\n</details>',
            });

  # Same shape as the AWS job. The difference is the login step: `azure/login` exchanges the
  # GitHub OIDC token for an Entra ID token, and the azurerm provider then picks up the
  # resulting CLI session. No client secret, no certificate, nothing to rotate.
  #
  # The service principal needs Contributor *and* User Access Administrator, because the
  # modules create role assignments (AcrPull, Key Vault Secrets User) -- see
  # scripts/azure-oidc-bootstrap.sh.
  plan-azure:
    name: plan (azure/dev)
    needs: validate
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/azure/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.AZURE_TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.AZURE_TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.AZURE_TFSTATE_CONTAINER }}"

      - name: Plan
        run: |
          terraform plan -input=false -lock-timeout=5m -out=tfplan
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: Policy check
        run: |-
          set -euo pipefail
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" conftest
          "$RUNNER_TEMP/conftest" test plan.json -p ../../../../platform/policies

      - name: Comment the plan on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |-
            const fs = require('fs');
            const file = 'infra/envs/azure/dev/plan.txt';
            const plan = fs.existsSync(file) ? fs.readFileSync(file, 'utf8').slice(0, 60000) : 'Plan was not produced. Check the workflow logs.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Terraform plan (`azure/dev`)\n\n<details><summary>Show plan</summary>\n\n```terraform\n' + plan + '\n```\n\n</details>',
            });

  # The third authentication shape: no role to assume (AWS) and no app registration to log
  # into (Azure). A Workload Identity Federation pool exchanges the GitHub OIDC token for a
  # federated credential, which then impersonates a service account. `google-github-actions/auth`
  # writes an external_account JSON file and exports GOOGLE_APPLICATION_CREDENTIALS, which the
  # google provider picks up on its own -- so, again, no credential is configured in Terraform.
  #
  # The pool, the provider and the service account come from infra/bootstrap/gcp.
  plan-gcp:
    name: plan (gcp/cloudrun)
    needs: validate
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/gcp/cloudrun
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.GCP_TF_STATE_BUCKET }}"

      # The environment root has no project default on purpose: one plan must not silently
      # target whichever project the credentials happen to belong to.
      - name: Plan
        run: |
          terraform plan -input=false -lock-timeout=5m \
            -var="project=${{ vars.GCP_PROJECT_ID }}" \
            -var="image_tag=${{ github.sha }}" \
            -out=tfplan
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: Policy check
        run: |-
          set -euo pipefail
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" conftest
          "$RUNNER_TEMP/conftest" test plan.json -p ../../../../platform/policies

      - name: Comment the plan on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |-
            const fs = require('fs');
            const file = 'infra/envs/gcp/cloudrun/plan.txt';
            const plan = fs.existsSync(file) ? fs.readFileSync(file, 'utf8').slice(0, 60000) : 'Plan was not produced. Check the workflow logs.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Terraform plan (`gcp/cloudrun`)\n\n<details><summary>Show plan</summary>\n\n```terraform\n' + plan + '\n```\n\n</details>',
            });
