name: apps-ci

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "pyproject.toml"
      - ".github/workflows/apps-ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - "pyproject.toml"
      - "docker-compose.yml"
      - ".github/workflows/apps-ci.yml"

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r apps/requirements-dev.txt

      - name: Ruff lint
        run: ruff check apps

      - name: Ruff format check
        run: ruff format --check apps

      - name: Pytest
        run: pytest

  container-security:
    name: build + scan ${{ matrix.service }}
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, catalog, gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f apps/${{ matrix.service }}/Dockerfile -t showcase/${{ matrix.service }}:${{ github.sha }} .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: showcase/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
