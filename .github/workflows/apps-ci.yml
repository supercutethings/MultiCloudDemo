name: apps-ci

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "pyproject.toml"
      - ".github/workflows/apps-ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - "pyproject.toml"
      - "docker-compose.yml"
      - ".github/workflows/apps-ci.yml"

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r apps/requirements-dev.txt

      - name: Ruff lint
        run: ruff check apps

      - name: Ruff format check
        run: ruff format --check apps

      - name: Pytest
        run: pytest

  container-security:
    name: build + scan ${{ matrix.service }}
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, catalog, gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f apps/${{ matrix.service }}/Dockerfile -t showcase/${{ matrix.service }}:${{ github.sha }} .

      # The Trivy action pins an internal helper action that no longer resolves, so the
      # scanner is installed as a plain binary and invoked directly. Same result, one
      # fewer moving part between the job and the scanner.
      - name: Install Trivy
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan image for vulnerabilities
        run: |
          trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
            "showcase/${{ matrix.service }}:${{ github.sha }}"
