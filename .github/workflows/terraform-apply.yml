name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "apps/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch: # manual re-deploy

permissions:
  contents: read
  id-token: write

# Never run two applies against the same state at once.
concurrency:
  group: tf-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  apply-aws:
    name: apply (aws/dev)
    runs-on: ubuntu-latest
    # A fresh clone has no AWS account wired up. Without this guard the job fails
    # on a missing repository variable instead of reporting "nothing to deploy".
    if: vars.AWS_ROLE_ARN != ''
    # Requires a reviewer approval configured on this environment:
    # Settings -> Environments -> aws-dev -> Required reviewers.
    environment: aws-dev
    defaults:
      run:
        working-directory: infra/envs/aws/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-tf-apply

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      # The ECR repositories must exist before images can be pushed, and the images must
      # exist before ECS tasks can start. Apply only the registry first, then push.
      - name: Create registries
        run: terraform apply -input=false -auto-approve -target=module.ecr

      - name: Push the commit's images
        run: |
          set -euo pipefail
          REGISTRY=$(terraform output -raw ecr_repository_urls | python3 -c 'import json,sys; print(json.load(sys.stdin)["gateway"].split("/")[0])')
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$REGISTRY"

          for service in auth catalog gateway; do
            repo=$(terraform output -raw ecr_repository_urls | python3 -c "import json,sys; print(json.load(sys.stdin)['${service}'])")
            docker build -f "$GITHUB_WORKSPACE/apps/${service}/Dockerfile" -t "${repo}:${IMAGE_TAG}" "$GITHUB_WORKSPACE"
            docker push "${repo}:${IMAGE_TAG}"
          done

      - name: Apply
        run: terraform apply -input=false -auto-approve -var="image_tag=${IMAGE_TAG}"

      - name: Smoke test through the load balancer
        working-directory: .
        run: |
          URL=$(terraform -chdir=infra/envs/aws/dev output -raw url)
          echo "smoke testing $URL"
          bash scripts/smoke.sh "$URL"

  # The Azure mirror of the job above, including the same two-phase apply: registry first,
  # then the images, then the apps that reference them.
  #
  # `az acr login --expose-token` avoids the Docker credential helper: the CI runner gets a
  # short-lived token for one registry and nothing is written to ~/.docker/config.json that
  # outlives the job.
  apply-azure:
    name: apply (azure/dev)
    runs-on: ubuntu-latest
    if: vars.AZURE_CLIENT_ID != ''
    # Settings -> Environments -> azure-dev -> Required reviewers.
    environment: azure-dev
    defaults:
      run:
        working-directory: infra/envs/azure/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.AZURE_TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.AZURE_TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.AZURE_TFSTATE_CONTAINER }}"

      # The registry has to exist before an image can be pushed, and the app revisions have
      # to find their image already there -- otherwise the first revision crash-loops.
      - name: Create the registry
        run: terraform apply -input=false -auto-approve -target=module.acr

      - name: Push the commit's images
        run: |
          set -euo pipefail
          REGISTRY=$(terraform output -raw acr_login_server)
          TOKEN=$(az acr login --name "${REGISTRY%%.*}" --expose-token \
            --output tsv --query accessToken)
          echo "$TOKEN" | docker login "$REGISTRY" \
            --username 00000000-0000-0000-0000-000000000000 --password-stdin

          for service in auth catalog gateway; do
            docker build -f "$GITHUB_WORKSPACE/apps/${service}/Dockerfile" \
              -t "${REGISTRY}/${service}:${IMAGE_TAG}" "$GITHUB_WORKSPACE"
            docker push "${REGISTRY}/${service}:${IMAGE_TAG}"
          done

      - name: Apply
        run: terraform apply -input=false -auto-approve -var="image_tag=${IMAGE_TAG}"

      - name: Smoke test through the Container Apps ingress
        working-directory: .
        run: |
          URL=$(terraform -chdir=infra/envs/azure/dev output -raw url)
          echo "smoke testing $URL"
          bash scripts/smoke.sh "$URL"

  # GCP, third authentication shape again: a Workload Identity Federation pool exchanges the
  # GitHub OIDC token for a federated credential that impersonates a service account. There is
  # no key file to leak and nothing to rotate.
  #
  # The pool, the provider and the service account come from infra/bootstrap/gcp. The region
  # and project are passed as -var because the environment root has no defaults for them.
  apply-gcp:
    name: apply (gcp/cloudrun)
    runs-on: ubuntu-latest
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    # Settings -> Environments -> gcp-cloudrun -> Required reviewers.
    environment: gcp-cloudrun
    defaults:
      run:
        working-directory: infra/envs/gcp/cloudrun
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.GCP_TF_STATE_BUCKET }}"

      # Registry first, for the same reason ECR and ACR are first: a Cloud Run revision that
      # references an image which does not exist yet crash-loops instead of deploying.
      - name: Create the registry
        run: |
          terraform apply -input=false -auto-approve -target=module.registry \
            -var="project=${{ vars.GCP_PROJECT_ID }}"

      - name: Push the commit's images
        run: |
          set -euo pipefail
          PREFIX=$(terraform output -raw image_repository_prefix)
          # Artifact Registry authenticates against the regional host, not the full path.
          gcloud auth configure-docker "${PREFIX%%/*}" --quiet

          for service in auth catalog gateway; do
            docker build -f "$GITHUB_WORKSPACE/apps/${service}/Dockerfile" \
              -t "${PREFIX}/${service}:${IMAGE_TAG}" "$GITHUB_WORKSPACE"
            docker push "${PREFIX}/${service}:${IMAGE_TAG}"
          done

      - name: Apply
        run: |
          terraform apply -input=false -auto-approve \
            -var="project=${{ vars.GCP_PROJECT_ID }}" \
            -var="image_tag=${IMAGE_TAG}"

      - name: Smoke test through the Cloud Run URL
        working-directory: .
        run: |
          URL=$(terraform -chdir=infra/envs/gcp/cloudrun output -raw url)
          echo "smoke testing $URL"
          bash scripts/smoke.sh "$URL"
