name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "apps/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch: # manual re-deploy

permissions:
  contents: read
  id-token: write

# Never run two applies against the same state at once.
concurrency:
  group: tf-apply-aws-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  apply:
    name: apply (aws/dev)
    runs-on: ubuntu-latest
    # Requires a reviewer approval configured on this environment:
    # Settings -> Environments -> aws-dev -> Required reviewers.
    environment: aws-dev
    defaults:
      run:
        working-directory: infra/envs/aws/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-tf-apply

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      # The ECR repositories must exist before images can be pushed, and the images must
      # exist before ECS tasks can start. Apply only the registry first, then push.
      - name: Create registries
        run: terraform apply -input=false -auto-approve -target=module.ecr

      - name: Push the commit's images
        run: |
          set -euo pipefail
          REGISTRY=$(terraform output -raw ecr_repository_urls | python3 -c 'import json,sys; print(json.load(sys.stdin)["gateway"].split("/")[0])')
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$REGISTRY"

          for service in auth catalog gateway; do
            repo=$(terraform output -raw ecr_repository_urls | python3 -c "import json,sys; print(json.load(sys.stdin)['${service}'])")
            docker build -f "$GITHUB_WORKSPACE/apps/${service}/Dockerfile" -t "${repo}:${IMAGE_TAG}" "$GITHUB_WORKSPACE"
            docker push "${repo}:${IMAGE_TAG}"
          done

      - name: Apply
        run: terraform apply -input=false -auto-approve -var="image_tag=${IMAGE_TAG}"

      - name: Smoke test through the load balancer
        working-directory: .
        run: |
          URL=$(terraform -chdir=infra/envs/aws/dev output -raw url)
          echo "smoke testing $URL"
          bash scripts/smoke.sh "$URL"
