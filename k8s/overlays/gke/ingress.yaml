# A GCE Ingress becomes a global external HTTPS load balancer: anycast IP, Google-managed
# TLS certificate, and backend health checks derived from the BackendConfig below.
#
# `kubernetes.io/ingress.allow-http: "false"` means there is no plaintext listener at all,
# rather than a redirect that still accepts the request.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "__STATIC_IP__"
    kubernetes.io/ingress.allow-http: "false"
    networking.gke.io/managed-certificates: "gateway-cert"
spec:
  defaultBackend:
    service:
      name: gateway
      port:
        number: 8000
