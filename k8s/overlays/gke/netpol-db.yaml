# Cloud SQL (private IP) sits in the VPC peering range, so database egress is limited to the
# VPC CIDR on 5432. With Dataplane V2 NetworkPolicy is enforced by the eBPF dataplane, not
# by iptables on every node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-egress-vpc
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [auth, catalog]
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: __VPC_CIDR__
      ports:
        - protocol: TCP
          port: 5432
