# Secret Manager -> Kubernetes Secrets. Workload Identity binds the external-secrets
# Kubernetes service account to a Google service account that has
# roles/secretmanager.secretAccessor on these two secrets only (created in Terraform).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    gcpsm:
      projectID: __GCP_PROJECT__
      auth:
        workloadIdentity:
          clusterLocation: __GCP_REGION__
          clusterName: __GKE_CLUSTER__
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: auth-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: database-url
    - secretKey: jwt-private-key
      remoteRef:
        key: jwt-private-key
    - secretKey: jwt-public-key
      remoteRef:
        key: jwt-public-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: catalog-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: catalog-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: database-url
    - secretKey: jwt-public-key
      remoteRef:
        key: jwt-public-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gateway-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-public-key
      remoteRef:
        key: jwt-public-key
---

# --- Internal certificates ----------------------------------------------------------
# Nothing here: auth-mtls, catalog-mtls and gateway-mtls are issued and rotated *inside*
# the cluster by cert-manager (k8s/components/internal-pki), not pulled from the cloud
# secret manager. Keeping them out of External Secrets is deliberate -- two controllers
# owning the same Secret name is a reconcile fight, and the loser is whichever pod started
# first. See ADR 0006 and docs/kubernetes.md.
