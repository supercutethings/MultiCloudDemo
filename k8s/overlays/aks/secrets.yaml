# Key Vault -> Kubernetes Secrets via External Secrets with workload identity federation
# (no client secret anywhere). Azure Key Vault has no JSON property extraction, so the
# secrets are stored as three separate Key Vault secrets and mapped 1:1.
#
# The Terraform in infra/envs/azure/aks creates the vault, grants the federated identity
# "Key Vault Secrets User", and writes the values at apply time.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    azurekv:
      vaultUrl: __AZURE_KEYVAULT_URI__
      authType: WorkloadIdentity
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: auth-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: database-url
    - secretKey: jwt-private-key
      remoteRef:
        key: jwt-private-key
    - secretKey: jwt-public-key
      remoteRef:
        key: jwt-public-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: catalog-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: catalog-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: database-url
    - secretKey: jwt-public-key
      remoteRef:
        key: jwt-public-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gateway-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-public-key
      remoteRef:
        key: jwt-public-key
---

# --- Internal certificates ----------------------------------------------------------
# Nothing here: auth-mtls, catalog-mtls and gateway-mtls are issued and rotated *inside*
# the cluster by cert-manager (k8s/components/internal-pki), not pulled from the cloud
# secret manager. Keeping them out of External Secrets is deliberate -- two controllers
# owning the same Secret name is a reconcile fight, and the loser is whichever pod started
# first. See ADR 0006 and docs/kubernetes.md.
