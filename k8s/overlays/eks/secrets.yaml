# Secrets never live in git, in an image, or in a manifest. External Secrets Operator
# authenticates to Secrets Manager with IRSA (the controller's own service account, no
# static keys) and materialises ordinary Kubernetes Secrets that the pods read.
#
# The double-underscore tokens below are replaced by scripts/k8s-render.sh, so no
# account-specific value is ever committed.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: platform-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: __AWS_REGION__
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: auth-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: __SECRETS_PREFIX__/database-url
        property: url
    - secretKey: jwt-private-key
      remoteRef:
        key: __SECRETS_PREFIX__/jwt-keys
        property: private_key
    - secretKey: jwt-public-key
      remoteRef:
        key: __SECRETS_PREFIX__/jwt-keys
        property: public_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: catalog-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: catalog-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: __SECRETS_PREFIX__/database-url
        property: url
    - secretKey: jwt-public-key
      remoteRef:
        key: __SECRETS_PREFIX__/jwt-keys
        property: public_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gateway-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-public-key
      remoteRef:
        key: __SECRETS_PREFIX__/jwt-keys
        property: public_key
---

# --- Internal certificates ----------------------------------------------------------
# Nothing here: auth-mtls, catalog-mtls and gateway-mtls are issued and rotated *inside*
# the cluster by cert-manager (k8s/components/internal-pki), not pulled from the cloud
# secret manager. Keeping them out of External Secrets is deliberate -- two controllers
# owning the same Secret name is a reconcile fight, and the loser is whichever pod started
# first. See ADR 0006 and docs/kubernetes.md.
