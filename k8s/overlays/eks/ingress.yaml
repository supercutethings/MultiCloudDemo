# AWS Load Balancer Controller turns this Ingress into a real ALB with:
#   * one target group of *pod IPs* (target-type: ip), so traffic crosses AZs natively and
#     the ALB spreads across every zone the pods live in (cross-zone load balancing is on
#     by default for IP targets);
#   * TLS 1.3-capable listener with redirect from 80;
#   * health checks against /readyz, which is exactly what the ECS stack polls.
#
# The controller reads subnets tagged `kubernetes.io/role/elb` (public) -- the Terraform
# network module adds those tags when `cluster_name` is set.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/certificate-arn: __CERTIFICATE_ARN__
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200"
    # Drop invalid headers and cap idle time so a slow client cannot pin a connection.
    alb.ingress.kubernetes.io/load-balancer-attributes: >-
      routing.http2.enabled=true,
      routing.http.drop_invalid_header_fields.enabled=true,
      routing.http.xff_header_processing.mode=append,
      idle_timeout.timeout_seconds=60
    alb.ingress.kubernetes.io/tags: Project=showcase,ManagedBy=terraform
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
