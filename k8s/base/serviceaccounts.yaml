# One identity per workload, and no projected API token.
#
# `automountServiceAccountToken: false` means a compromised container has no Kubernetes
# API credential to steal. These services make no cloud API calls either: secrets arrive
# as Kubernetes Secrets (created by External Secrets), so there is no cloud identity on
# the workload at all. Only cluster add-ons (ingress, autoscaler, secrets operator) carry
# cloud permissions, and each of those has its own narrow role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
automountServiceAccountToken: false
